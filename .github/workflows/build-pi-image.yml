# This workflow builds a Raspberry Pi image with Docker and Bitbot pre-installed
# and uploads the bootable image as an artifact.

name: Build Bitbot Pi Image

on: [push]
# on:
#   workflow_dispatch:
#   push:
#     branches: [ main ]

jobs:
  build-pi-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      # Create a stage 'test-stage' instructing to add Nodesource repo and install nodejs as dependency
      
      - name: Create custom stage for Docker
        run: |
          mkdir -p test-stage/package-test &&
          cp docker-compose.yml test-stage/package-test/ &&
          cp docker-compose.override.yml test-stage/package-test/ || true &&
          cat > test-stage/package-test/00-run-chroot.sh <<-EOF
          #!/bin/bash
          set -e
          apt-get install -y docker.io
          # Install docker-compose if needed (for legacy systems)
          if ! command -v docker-compose &>/dev/null; then
            apt-get install -y docker-compose || true
          fi
          # Copy compose files to /opt/bitbot
          mkdir -p /opt/bitbot
          cp /stage/package-test/docker-compose*.yml /opt/bitbot/
          # Create systemd service
          cat > /etc/systemd/system/bitbot-compose.service <<EOL
          [Unit]
          Description=Bitbot Docker Compose Service
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/bitbot
          ExecStart=/usr/bin/docker compose up -d
          ExecStop=/usr/bin/docker compose down

          [Install]
          WantedBy=multi-user.target
          EOL

          systemctl enable bitbot-compose.service
          EOF
          chmod +x test-stage/package-test/00-run-chroot.sh

      - name: Build Raspberry Pi image
        uses: usimd/pi-gen-action@v1
        id: build
        with:
          image-name: bitbot-pi
          hostname: bitbot
          enable-ssh: 1
          stage-list: stage0 stage1 stage2 ./test-stage
          release: bookworm
          compression: zip
          verbose-output: true
          # increase-runner-disk-size: true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitbot-pi-image
          path: ${{ steps.build.outputs.image-path }}
